syntax = "proto3";

package site.v1;

option go_package = "github.com/monstercameron/earlcameron/proto/sitepb;sitepb";

import "site.proto";

// AdminService is the owner-gated control plane — the anime tracker and the résumé tailoring tool.
// This is the data plane for the admin console (a GWC/WASM frontend talks to it over the same
// GoGRPCBridge WebSocket tunnel as the public site). Every method except Login requires a valid
// session token in the "authorization" request metadata (value: "Bearer <token>"); the server
// enforces this with a unary interceptor. Documents (the RSS feeds and the résumé PDF page) stay
// on the HTTP GET document plane and are not part of this service.
service AdminService {
  // Login exchanges the admin password for a signed session token used by every other method.
  rpc Login(LoginRequest) returns (LoginReply);
  // SearchAnime queries AniList and marks which results are already tracked.
  rpc SearchAnime(SearchRequest) returns (AnimeList);
  // ListTracked returns the currently tracked shows.
  rpc ListTracked(Empty) returns (AnimeList);
  // TrackAnime begins tracking an AniList id.
  rpc TrackAnime(AnimeId) returns (Ack);
  // UntrackAnime stops tracking an AniList id.
  rpc UntrackAnime(AnimeId) returns (Ack);
  // RunReleaseCheck refreshes tracked shows against AniList and reports how many changed.
  rpc RunReleaseCheck(Empty) returns (CheckReply);
  // GetResume returns the active résumé — the applied override if one exists, else the canonical.
  rpc GetResume(Empty) returns (Resume);
  // ApplyResume saves a résumé as the active one (served by GetResume and the /resume page).
  rpc ApplyResume(Resume) returns (Ack);
  // TailorResume fetches a job posting and returns the tailored résumé plus the signals extracted
  // from the posting and the rationale for each tailoring choice. The résumé is constrained to the
  // canonical one — the model cannot fabricate employers/skills/etc.
  rpc TailorResume(TailorRequest) returns (TailorResult);
  // GetSettings returns the current settings (the API key is never returned — only whether one is set).
  rpc GetSettings(Empty) returns (Settings);
  // SaveSettings persists settings. A blank openai_api_key leaves the stored key unchanged.
  rpc SaveSettings(Settings) returns (Ack);
  // ListModels returns the chat models available to the stored OpenAI key.
  rpc ListModels(Empty) returns (ModelList);
  // GetLastTailoring returns the most recent saved tailoring result (empty resume if none).
  rpc GetLastTailoring(Empty) returns (TailorResult);
}

// Settings is the web-editable configuration. On GetSettings the key is never populated (only
// key_set); on SaveSettings a non-empty openai_api_key is stored and a blank one is ignored.
message Settings {
  string openai_api_key = 1;
  string openai_model = 2;
  bool key_set = 3;
}

// ModelList is the set of selectable model ids.
message ModelList {
  repeated string models = 1;
}

// Empty is a no-argument request.
message Empty {}

// LoginRequest carries the admin username + password.
message LoginRequest {
  string username = 1;
  string password = 2;
}

// LoginReply returns a signed JWT on success.
message LoginReply {
  bool ok = 1;
  string token = 2;
}

// SearchRequest is an AniList search query.
message SearchRequest {
  string query = 1;
}

// AnimeId identifies one show by its AniList id.
message AnimeId {
  int32 anilist_id = 1;
}

// CheckReply reports how many tracked shows changed during a release check.
message CheckReply {
  int32 updated = 1;
}

// Anime is one show — an AniList search result or a tracked entry.
message Anime {
  int32 anilist_id = 1;
  string title = 2;
  string format = 3;
  string status = 4;
  int32 episodes = 5;
  int32 season_year = 6;
  string cover_image = 7;
  bool tracked = 8;
}

// AnimeList is an ordered set of shows.
message AnimeList {
  repeated Anime items = 1;
}

// Resume is the structured résumé (wire DTO mirroring internal/resume.Resume).
message Resume {
  string name = 1;
  string title = 2;
  string location = 3;
  string email = 4;
  string github = 5;
  string linkedin = 6;
  string summary = 7;
  repeated ResumeJob jobs = 8;
  repeated ResumeSkill skills = 9;
  repeated ResumeProject projects = 10;
  repeated string education = 11;
}

// ResumeJob is one work entry.
message ResumeJob {
  string role = 1;
  string org = 2;
  string dates = 3;
  repeated string bullets = 4;
}

// ResumeSkill is a labeled skills row.
message ResumeSkill {
  string label = 1;
  string items = 2;
}

// ResumeProject is one selected project.
message ResumeProject {
  string name = 1;
  string desc = 2;
}

// TailorRequest carries the job-posting URL to tailor against.
message TailorRequest {
  string job_url = 1;
}

// TailorResult is the full output of a tailoring pass: the tailored résumé, the signals the tool
// extracted from the posting, and the rationale for each choice.
message TailorResult {
  Resume resume = 1;
  JobAnalysis job = 2;
  repeated Rationale rationales = 3;
}

// JobAnalysis is what the tool pulled out of the job posting.
message JobAnalysis {
  string title = 1;
  string company = 2;
  repeated string keywords = 3;     // key skills/terms the posting emphasizes
  repeated string requirements = 4; // key requirements / responsibilities
}

// Rationale explains one tailoring decision: what was emphasized and why.
message Rationale {
  string focus = 1;  // what changed / was emphasized (e.g. "Summary", "UKG bullet on React")
  string reason = 2; // why, tied to a job signal
}
