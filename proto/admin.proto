syntax = "proto3";

package site.v1;

option go_package = "github.com/monstercameron/earlcameron/proto/sitepb;sitepb";

import "site.proto";

// AdminService is the owner-gated control plane — the anime tracker and the résumé tailoring tool.
// This is the data plane for the admin console (a GWC/WASM frontend talks to it over the same
// GoGRPCBridge WebSocket tunnel as the public site). Every method except Login requires a valid
// session token in the "authorization" request metadata (value: "Bearer <token>"); the server
// enforces this with a unary interceptor. Documents (the RSS feeds and the résumé PDF page) stay
// on the HTTP GET document plane and are not part of this service.
service AdminService {
  // Login exchanges the admin password for a signed session token used by every other method.
  rpc Login(LoginRequest) returns (LoginReply);
  // AuthState reports whether the deployed site still needs first-run owner setup, and the recovery
  // hint to show on the reset screen. Public (no session): the client calls it before login.
  rpc AuthState(Empty) returns (AuthStateReply);
  // Setup creates the owner account on first run and returns the one-time recovery phrase. Public,
  // but the server refuses once an account exists or when env credentials manage auth.
  rpc Setup(SetupRequest) returns (SetupReply);
  // ResetPassword verifies the recovery phrase (or the env break-glass) and sets a new password,
  // returning the rotated recovery phrase. Public (the owner is locked out by definition).
  rpc ResetPassword(ResetRequest) returns (ResetReply);
  // SearchAnime queries AniList and marks which results are already tracked.
  rpc SearchAnime(SearchRequest) returns (AnimeList);
  // ListTracked returns the currently tracked shows.
  rpc ListTracked(Empty) returns (AnimeList);
  // TrackAnime begins tracking an AniList id.
  rpc TrackAnime(AnimeId) returns (Ack);
  // UntrackAnime stops tracking an AniList id.
  rpc UntrackAnime(AnimeId) returns (Ack);
  // RunReleaseCheck refreshes tracked shows against AniList and reports how many changed.
  rpc RunReleaseCheck(Empty) returns (CheckReply);
  // GetResume returns the active résumé — the applied override if one exists, else the canonical.
  rpc GetResume(Empty) returns (Resume);
  // ApplyResume saves a résumé as the active one (served by GetResume and the /resume page).
  rpc ApplyResume(Resume) returns (Ack);
  // TailorResume fetches a job posting and returns the tailored résumé plus the signals extracted
  // from the posting and the rationale for each tailoring choice. The résumé is constrained to the
  // canonical one — the model cannot fabricate employers/skills/etc.
  rpc TailorResume(TailorRequest) returns (TailorResult);
  // GetSettings returns the current settings (the API key is never returned — only whether one is set).
  rpc GetSettings(Empty) returns (Settings);
  // SaveSettings persists settings. A blank openai_api_key leaves the stored key unchanged.
  rpc SaveSettings(Settings) returns (Ack);
  // ListModels returns the chat models available to the stored OpenAI key.
  rpc ListModels(Empty) returns (ModelList);
  // GetLastTailoring returns the most recent saved tailoring result (empty resume if none).
  rpc GetLastTailoring(Empty) returns (TailorResult);
  // GetBaseResume returns the permanent canonical résumé (the diff baseline; never overwritten).
  rpc GetBaseResume(Empty) returns (Resume);
  // ListTailorings returns saved tailoring variants (metadata only), newest first.
  rpc ListTailorings(Empty) returns (TailoringList);
  // GetTailoring loads one saved variant's full result by id (for re-opening / re-tweaking).
  rpc GetTailoring(TailoringId) returns (TailorResult);
  // DeleteTailoring removes a saved variant by id.
  rpc DeleteTailoring(TailoringId) returns (Ack);
  // --- RSS / anime control panel ---
  // ListPrompts returns the configurable QOTD (question-of-the-day) prompts.
  rpc ListPrompts(Empty) returns (PromptList);
  // AddPrompt adds a QOTD prompt.
  rpc AddPrompt(PromptText) returns (Ack);
  // DeletePrompt removes a QOTD prompt by id.
  rpc DeletePrompt(PromptId) returns (Ack);
  // GetSlackConfig returns the Slack posting config (the webhook URL is never returned, only whether set).
  rpc GetSlackConfig(Empty) returns (SlackConfig);
  // SaveSlackConfig persists the Slack config (a blank webhook_url leaves the stored one unchanged).
  rpc SaveSlackConfig(SlackConfig) returns (Ack);
  // PostToSlackNow composes the latest anime news + today's prompt and posts it to Slack now.
  rpc PostToSlackNow(Empty) returns (Ack);
}

// PromptText carries a QOTD prompt to add.
message PromptText {
  string text = 1;
}

// PromptId identifies a QOTD prompt.
message PromptId {
  int64 id = 1;
}

// Prompt is one QOTD prompt.
message Prompt {
  int64 id = 1;
  string text = 2;
  int64 created_at = 3;
}

// PromptList is the configured QOTD prompts, newest first.
message PromptList {
  repeated Prompt items = 1;
}

// SlackConfig is the Slack posting configuration. On read, webhook_url is empty and webhook_set
// reports whether one is stored; on write, a blank webhook_url leaves the stored value unchanged.
message SlackConfig {
  string webhook_url = 1;
  bool enabled = 2;
  bool webhook_set = 3;
}

// TailoringId identifies a saved variant.
message TailoringId {
  int64 id = 1;
}

// TailoringMeta is the glanceable summary of a saved variant (no résumé payload).
message TailoringMeta {
  int64 id = 1;
  string job_url = 2;
  string title = 3;
  string company = 4;
  int64 created_at = 5;         // unix seconds
  repeated string keywords = 6; // top job keywords — what the tailoring emphasized, at a glance
}

// TailoringList is the saved variants, newest first.
message TailoringList {
  repeated TailoringMeta items = 1;
}

// Settings is the web-editable configuration. On GetSettings the key is never populated (only
// key_set); on SaveSettings a non-empty openai_api_key is stored and a blank one is ignored.
message Settings {
  string openai_api_key = 1;
  string openai_model = 2;
  bool key_set = 3;
}

// ModelList is the set of selectable model ids.
message ModelList {
  repeated string models = 1;
}

// Empty is a no-argument request.
message Empty {}

// LoginRequest carries the admin username + password.
message LoginRequest {
  string username = 1;
  string password = 2;
}

// LoginReply returns a signed JWT on success.
message LoginReply {
  bool ok = 1;
  string token = 2;
}

// AuthStateReply tells the client which auth screen to show.
message AuthStateReply {
  bool needs_setup = 1;    // true on a fresh, unconfigured deploy — show the setup screen
  string recovery_hint = 2; // owner-chosen memory jog for the reset screen ("" if no account/hint)
}

// SetupRequest creates the first owner account. setup_token is required only when the server has
// ADMIN_SETUP_TOKEN configured.
message SetupRequest {
  string username = 1;
  string password = 2;
  string hint = 3;
  string setup_token = 4;
}

// SetupReply returns a session token and the one-time recovery phrase (shown once). On failure ok is
// false and error carries a human-readable reason.
message SetupReply {
  bool ok = 1;
  string token = 2;
  string recovery_phrase = 3;
  string error = 4;
}

// ResetRequest resets the owner password using the recovery phrase (or the env break-glass token).
message ResetRequest {
  string recovery_phrase = 1;
  string new_password = 2;
}

// ResetReply returns the rotated recovery phrase (shown once) on success; error on failure.
message ResetReply {
  bool ok = 1;
  string recovery_phrase = 2;
  string error = 3;
}

// SearchRequest is an AniList search query.
message SearchRequest {
  string query = 1;
}

// AnimeId identifies one show by its AniList id.
message AnimeId {
  int32 anilist_id = 1;
}

// CheckReply reports how many tracked shows changed during a release check.
message CheckReply {
  int32 updated = 1;
}

// Anime is one show — an AniList search result or a tracked entry.
message Anime {
  int32 anilist_id = 1;
  string title = 2;
  string format = 3;
  string status = 4;
  int32 episodes = 5;
  int32 season_year = 6;
  string cover_image = 7;
  bool tracked = 8;
}

// AnimeList is an ordered set of shows.
message AnimeList {
  repeated Anime items = 1;
}

// Resume is the structured résumé (wire DTO mirroring internal/resume.Resume).
message Resume {
  string name = 1;
  string title = 2;
  string location = 3;
  string email = 4;
  string github = 5;
  string linkedin = 6;
  string summary = 7;
  repeated ResumeJob jobs = 8;
  repeated ResumeSkill skills = 9;
  repeated ResumeProject projects = 10;
  repeated string education = 11;
}

// ResumeJob is one work entry.
message ResumeJob {
  string role = 1;
  string org = 2;
  string dates = 3;
  repeated string bullets = 4;
}

// ResumeSkill is a labeled skills row.
message ResumeSkill {
  string label = 1;
  string items = 2;
}

// ResumeProject is one selected project.
message ResumeProject {
  string name = 1;
  string desc = 2;
}

// TailorRequest carries the job-posting URL to tailor against.
message TailorRequest {
  string job_url = 1;
}

// TailorResult is the full output of a tailoring pass: the tailored résumé, the signals the tool
// extracted from the posting, and the rationale for each choice.
message TailorResult {
  Resume resume = 1;
  JobAnalysis job = 2;
  repeated Rationale rationales = 3;
}

// JobAnalysis is what the tool pulled out of the job posting.
message JobAnalysis {
  string title = 1;
  string company = 2;
  repeated string keywords = 3;     // key skills/terms the posting emphasizes
  repeated string requirements = 4; // key requirements / responsibilities
}

// Rationale explains one tailoring decision: what was emphasized and why.
message Rationale {
  string focus = 1;  // what changed / was emphasized (e.g. "Summary", "UKG bullet on React")
  string reason = 2; // why, tied to a job signal
}
