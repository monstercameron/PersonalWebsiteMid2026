# Nginx site for earlcameron.com — installed to /etc/nginx/sites-available/earlcameron
# by deploy/install.sh, symlinked into sites-enabled.
#
# This file is deliberately HTTP-only. `certbot --nginx` rewrites it in place: it adds the
# listen 443 ssl block, the ssl_certificate lines, and the :80 -> :443 redirect. Shipping a
# pre-baked 443 block would collide with that and is the usual reason a first deploy fights
# certbot instead of being done in one command.

upstream earlcameron_app {
    server 127.0.0.1:8095;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name earlcameron.com www.earlcameron.com;

    # The résumé tailor posts a whole job description and the contact form posts prose;
    # nginx's 1m default is tight enough to bite.
    client_max_body_size 10m;

    # app.wasm is ~26 MB uncompressed and the Go file server does not compress. This is the
    # only thing standing between a visitor and a 26 MB download, so it matters more here
    # than typical gzip config does. Already-compressed types (main.wasm.gz, fonts, png)
    # are intentionally absent from the list.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/wasm application/javascript application/json text/css text/plain
               text/html image/svg+xml application/xml application/rss+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # SAMEORIGIN, not DENY: the site embeds the hosted CashFlux app in an iframe.
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Enable once certbot has issued and you have confirmed HTTPS works. Turning HSTS on
    # before that can lock the domain out of plain HTTP while you are still debugging.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- data plane: gRPC over WebSocket -------------------------------------------
    # /socket is this site's own tunnel; /grpc is the EMBEDDED CashFlux sync engine's
    # tunnel (internal/server mounts s.cashfluxSync there) and /v1/version is the
    # handshake the CashFlux frontend probes before it will connect. All three must
    # upgrade — miss /grpc and the budget app silently fails "Test connection".
    # (/|$) because internal/server registers BOTH "/socket" and "/socket/" — a subpath
    # connect must upgrade too, and falling through to location / would drop the headers.
    location ~ ^/(socket|grpc)(/|$) {
        proxy_pass http://earlcameron_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # StreamStatus and Ask are long-lived server-streams. The 60s default would cut
        # them every minute and the client would reconnect forever.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /v1/version {
        proxy_pass http://earlcameron_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- document plane: wasm + SSR + RSS + PDF ------------------------------------
    # No `expires` header here on purpose. app.wasm is not content-hashed, so a long
    # cache lifetime would serve the previous release's wasm after a deploy. Go's
    # http.FileServer already sends Last-Modified and answers If-Modified-Since with a
    # 304, which gives revalidation without the staleness.
    location /static/ {
        proxy_pass http://earlcameron_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Stream the 26 MB wasm straight through instead of spooling it to a temp file.
        proxy_buffering off;
    }

    location / {
        proxy_pass http://earlcameron_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # internal/budget/gate.go trusts this header to decide whether to set the Secure
        # flag on its session cookie. Nginx terminates TLS, so without it every cookie is
        # issued as non-Secure.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Health endpoint stays local-only; update.sh checks 127.0.0.1:8095/healthz directly.
    location = /healthz {
        access_log off;
        proxy_pass http://earlcameron_app;
        proxy_set_header Host $host;
    }
}
